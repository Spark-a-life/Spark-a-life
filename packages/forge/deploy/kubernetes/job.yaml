apiVersion: batch/v1
kind: Job
metadata:
  name: forge-run
  namespace: wisegen-forge
spec:
  backoffLimit: 0          # a failed governed run is reviewed, never silently retried
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: forge
          image: wisegen-forge:1.0.0
          args: ["demo"]
          env:
            - { name: FORGE_ESTATE, value: kubernetes }
            - { name: FORGE_NETWORK, value: deny }
            - { name: FORGE_MODEL_PROFILE, value: deterministic }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: "250m", memory: "256Mi" }
            limits:   { cpu: "1",    memory: "1Gi" }
          volumeMounts:
            - { name: runs, mountPath: /app/.forge }
            - { name: tmp,  mountPath: /tmp }
      volumes:
        - name: runs
          persistentVolumeClaim: { claimName: forge-runs }
        - name: tmp
          emptyDir: {}
