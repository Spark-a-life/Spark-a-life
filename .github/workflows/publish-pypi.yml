name: Publish Python Package to PyPI

on:
  workflow_dispatch:
    inputs:
      module:
        description: "Python module to publish (forge or omega)"
        required: true
        type: choice
        options:
          - forge
          - omega

permissions:
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install build tools
        run: pip install build

      - name: Build distribution
        run: python -m build packages/${{ inputs.module }}

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: packages/${{ inputs.module }}/dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
